{% extends "base.html" %}

{% block title %}
Projects
{% endblock %}

{% block content %}

<h1>Projects</h1>

{% for project in projects %}

<div>

    <h2>{{ project.title }}</h2>

    <p>{{ project.description|truncatewords:20 }}</p>

    <a href="{% url 'project_detail' project.slug %}">
        View Project
    </a>

</div>

<hr>

{% endfor %}

{% endblock %}
